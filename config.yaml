# =====================================================================
# Extraction Workflow & Aggregation Configuration File
# Centralized settings for dynamic text extraction & data aggregation
# =====================================================================

# ---------------------------------------------------------------------
# Input Data Settings
# ---------------------------------------------------------------------
input:
  # Directory path or file path (.txt / .parquet / .pq) to scan
  path: "inputs"
  # Format of input data: "txt" or "parquet"
  format: "txt"
  # Column in Parquet containing document/record identifier (if format is parquet)
  id_column: "identifier"
  # Column in Parquet containing raw document text (if format is parquet)
  text_column: "anonymized"

# ---------------------------------------------------------------------
# Extraction Schema Settings
# ---------------------------------------------------------------------
schema:
  # Path to single Python schema file (.py) OR multi-file schema directory
  file: "schemas/test_schemas/multi_file_example"
  # Name of a specific schema class within schema file (null for all / auto-detect)
  class_name: null
  # DAG classification mode for multi-file directories: "top_level" | "all" | "child"
  # - "top_level": Uses DAG reflection to extract only root container models (reduces LLM calls by 70-85%)
  # - "all": Extracts all discovered Pydantic schemas (top-level and embedded child models)
  # - "child": Extracts only embedded child component models
  extract_mode: "top_level"

# ---------------------------------------------------------------------
# LLM Model & Server Settings
# ---------------------------------------------------------------------
model:
  # Ollama model identifier
  name: "qwen2.5:7b"
  # Ollama API base URL
  url: "http://localhost:11434/v1"
  # Maximum concurrent asynchronous LLM requests
  num_async_calls: 4

# ---------------------------------------------------------------------
# Text Chunking Settings
# ---------------------------------------------------------------------
chunking:
  # Target word count per chunk (0 to disable chunking)
  size: 1800
  # Number of overlapping words between consecutive chunks
  overlap: 30

# ---------------------------------------------------------------------
# Execution & Output Settings
# ---------------------------------------------------------------------
execution:
  # Output directory for extracted JSON files
  output_dir: "outputs"
  # Skip records that already have complete final output JSON files
  resume: true
  # Run synchronously instead of asynchronously
  sync_mode: false
  # Execution log file path
  log_file: "extraction_workflow.log"

# ---------------------------------------------------------------------
# Data Aggregation Settings (used by aggregate_outputs.py)
# ---------------------------------------------------------------------
aggregation:
  # Directory containing extracted JSON outputs to aggregate (defaults to execution.output_dir if null)
  input_dir: null
  # Directory where aggregated tables (CSV / SQLite) will be saved
  output_dir: "aggregated_tables"
  # SQLite database filename
  db_file: "aggregated_data.db"
  # Enable CSV table generation
  csv: true
  # Enable SQLite database generation
  sqlite: true
  # Store in normalized multi-table relational format (true) or single denormalized table (false)
  multi_table: true
